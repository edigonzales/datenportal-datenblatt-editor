map $http_x_forwarded_prefix $public_base_href {
    default "/";
    ~^/(?<gateway_prefix>[A-Za-z0-9._~-]+(?:/[A-Za-z0-9._~-]+)*)/?$ /$gateway_prefix/;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /index.html {
        # index.html contains a request-dependent <base> element and must not
        # be cached or shared between gateway prefixes.
        sub_filter_once on;
        sub_filter '<head>' '<head><base href="$public_base_href">';

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Vary "X-Forwarded-Prefix" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
