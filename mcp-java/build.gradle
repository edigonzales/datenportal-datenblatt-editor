plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'ch.so.agi'
version = '0.2.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories {
    mavenCentral()
    maven { url = uri('https://jars.interlis.ch') }
}
dependencyManagement { imports { mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1' } }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'ch.interlis:ilivalidator:1.15.0'
    implementation 'ch.interlis:iox-ili:1.24.4'
    implementation 'ch.interlis:iox-api:1.0.4'
    implementation 'ch.interlis:ili2c-core:5.6.8'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'ch.ehi:ehibasics:1.4.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
bootJar { archiveFileName = 'datasheet-mcp.jar' }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
